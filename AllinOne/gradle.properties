# Project-wide Gradle settings.

# Memory Optimization for Low RAM (1.1GB Free)
# Use a single JVM (in-process) to avoid multiple daemon overhead
kotlin.compiler.execution.strategy=daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false

# Enable KSP2 for better performance/memory if compatible
ksp.useKSP2=false
ksp.incremental=true

# AndroidX and Code Style
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

kotlin.incremental=true
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21.0.11